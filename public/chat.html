<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캐릭터 챗 · AI GM</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 배경 영상 · 사용자 바 · 설정/모델 모달은 common.js가 주입한다. -->

    <!-- 캐릭터 챗: 세계관 + 다중 캐릭터 설정 화면 -->
    <div id="chatSetup" class="setup hidden">
      <div class="setup-card wide">
        <h1 id="chatSetupTitle">💬 캐릭터 · 세계관 만들기</h1>
        <p class="subtitle">세계관과 여러 캐릭터를 직접 만들어 대화하세요. 캐릭터는 1명 이상 필요합니다.</p>

        <label>제목 <span class="opt">(선택 · 목록 표시명)</span></label>
        <input id="cpTitle" type="text" maxlength="80" placeholder="예: 안개 낀 마법 학원" />

        <label>세계관 설정 <span class="opt">(선택 · 여러 캐릭터일 때 유용)</span></label>
        <textarea id="cpLore" rows="3" placeholder="배경 세계, 규칙, 분위기 등"></textarea>

        <label>등장인물 *</label>
        <div id="cpCharacters" class="cp-characters"></div>
        <button type="button" id="cpAddChar" class="ghost cp-add">＋ 캐릭터 추가</button>

        <label>이미지 <span class="opt">(선택 · 태그를 달면 AI가 상황에 맞춰 보여줍니다)</span></label>
        <div id="cpImages" class="cp-images"></div>
        <input type="file" id="cpImageFile" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
        <button type="button" id="cpAddImage" class="ghost cp-add">＋ 이미지 추가</button>
        <p class="hint">
          2MB 이하 png/jpg/webp/gif, 최대 16장. 태그 예: <b>루나-미소</b>, <b>밤의 탑</b>, <b>전투</b>
        </p>

        <label>시작 상황 / 시나리오 <span class="opt">(선택)</span></label>
        <textarea id="cpScenario" rows="3" placeholder="첫 장면, 어디서 어떻게 시작하는지"></textarea>

        <label>첫 인사말 / 오프닝 <span class="opt">(선택)</span></label>
        <textarea id="cpGreeting" rows="2" placeholder="대화 시작 시 먼저 보여줄 장면·대사"></textarea>

        <label>내 페르소나 <span class="opt">(선택)</span></label>
        <textarea id="cpUserPersona" rows="2" placeholder="상대가 '나'를 어떻게 인식할지 (이름·관계 등)"></textarea>

        <label>장르 · 태그 <span class="opt">(선택 · 쉼표로 구분, 최대 6개)</span></label>
        <input id="cpTags" type="text" placeholder="예: 판타지, 미스터리, 느와르" />
        <div id="cpTagSuggest" class="tag-row"></div>

        <label>권장 응답 길이 <span class="opt">(플레이어가 각자 바꿀 수 있어요)</span></label>
        <select id="cpLength">
          <option value="veryshort">아주 짧게 (1~2문장 · 메신저형)</option>
          <option value="short">짧게 (2~4문장)</option>
          <option value="medium">보통 (1~2문단)</option>
          <option value="long">길게 (3~4문단)</option>
          <option value="verylong">아주 길게 (250~300단어 · 소설형)</option>
        </select>

        <label>공개 설정</label>
        <div class="publish-row">
          <select id="cpVisibility">
            <option value="private">🔒 비공개 (나만)</option>
            <option value="link">🔗 링크 아는 사람만</option>
            <option value="public">🌐 공개 (갤러리에 노출)</option>
          </select>
          <button type="button" id="cpPublish" class="ghost">적용</button>
        </div>
        <p class="hint" id="cpPublishHint">공개하면 다른 사용자가 각자 자기 대화로 플레이할 수 있어요.</p>

        <div id="chatSetupError" class="auth-error hidden"></div>
        <div class="wizard-nav">
          <button id="cpCancel" class="ghost">취소</button>
          <button id="cpGallery" class="ghost">🌐 갤러리</button>
          <button id="cpSave" class="primary">저장하고 대화 시작</button>
        </div>
      </div>
    </div>

    <!-- 캐릭터 챗: 대화 화면 -->
    <div id="chat" class="chat-screen hidden">
      <main class="log-pane">
        <header class="log-header">
          <div id="chatBar" class="slot-bar"></div>
          <div class="header-actions">
            <button id="chatModelBtn" class="ghost" title="이 챗의 AI 모델 변경">🧠 <span id="chatModelLabel">모델</span></button>
            <button id="chatEditBtn" class="ghost" title="캐릭터 설정 편집">✎ 설정</button>
            <button id="galleryBtn" class="ghost" title="공개 갤러리">🌐 갤러리</button>
            <button id="newChatBtn" class="ghost" title="새 캐릭터 만들기">＋ 새 캐릭터</button>
          </div>
        </header>
        <div id="chatLog" class="log"><div id="chatLogInner" class="log-inner"></div></div>
        <div id="chatThinking" class="thinking hidden">입력 중…</div>
        <form id="chatForm" class="input-bar">
          <input id="chatInput" type="text" placeholder="메시지를 입력하세요…" autocomplete="off" />
          <button type="submit" class="primary" id="chatSendBtn">전송</button>
        </form>
      </main>
    </div>

    <!-- 공개 갤러리 -->
    <div id="gallery" class="setup hidden">
      <div class="setup-card wide">
        <h1>🌐 갤러리</h1>
        <p class="subtitle">다른 사용자가 공개한 세계관·캐릭터를 각자 자기 대화로 플레이할 수 있어요.</p>

        <div class="gallery-controls">
          <select id="gallerySort">
            <option value="recent">최신순</option>
            <option value="likes">추천순</option>
            <option value="plays">플레이순</option>
          </select>
          <div id="galleryTags" class="tag-filter"></div>
        </div>

        <div id="galleryList" class="gallery-list"></div>
        <div id="adminPanel" class="hidden">
          <label>📊 접속 통계 <span class="opt">(운영자 전용)</span></label>
          <p class="hint">한국 시간 기준. 방문자는 IP를 되돌릴 수 없게 변환해 셉니다.</p>
          <div class="stat-grid" id="statToday"></div>
          <div class="stat-bars" id="statChart"></div>
          <p class="hint" id="statTotals"></p>

          <label>🛡 신고 관리 <span class="opt">(운영자 전용)</span></label>
          <p class="hint">신고가 들어온 항목입니다. 확인 후 조치하세요.</p>
          <div id="adminList" class="gallery-list"></div>
        </div>
        <div class="wizard-nav">
          <button id="galleryClose" class="ghost">닫기</button>
        </div>
      </div>
    </div>

    <!-- 내 프로필 (내가 공개한 작품) -->
    <div id="profile" class="setup hidden">
      <div class="setup-card wide">
        <h1>👤 내 프로필</h1>
        <p class="subtitle" id="profileSub"></p>
        <div id="profileTotals" class="profile-totals"></div>
        <label>내가 공개한 작품</label>
        <div id="profileList" class="gallery-list"></div>
        <div class="wizard-nav">
          <button id="profileClose" class="ghost">닫기</button>
          <button id="profileGallery" class="ghost">🌐 갤러리</button>
        </div>
      </div>
    </div>

    <!-- 작품 상세 (태그 · 추천 · 댓글) -->
    <div id="detailModal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 id="dtTitle">작품</h2>
        <p class="modal-sub" id="dtMeta"></p>
        <div id="dtTags" class="tag-row"></div>
        <div class="detail-actions">
          <button id="dtLike" class="ghost">♥ 추천 <span id="dtLikeCount">0</span></button>
          <button id="dtPlay" class="primary">플레이</button>
        </div>
        <label>댓글 <span class="opt" id="dtCommentCount"></span></label>
        <div id="dtComments" class="comment-list"></div>
        <div class="comment-form">
          <input id="dtCommentInput" type="text" maxlength="500" placeholder="댓글을 입력하세요" />
          <button id="dtCommentSend" class="primary">등록</button>
        </div>
        <div class="wizard-nav">
          <button id="dtClose" class="ghost">닫기</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/common.js"></script>
    <script src="/chat.js"></script>
  </body>
</html>
