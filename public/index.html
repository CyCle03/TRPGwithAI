<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI GM · 던전 월드 & 캐릭터 챗</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 배경 영상 · 사용자 바 · 설정/모델 모달은 common.js가 주입한다. -->

    <!-- 로그인 / 회원가입 -->
    <div id="auth" class="setup hidden">
      <div class="setup-card auth-card">
        <h1>🎲 AI GM 솔로 던전 월드</h1>
        <p class="subtitle" id="authSubtitle">로그인하고 모험을 시작하세요</p>
        <label>아이디</label>
        <input id="authUser" type="text" placeholder="영문/숫자/밑줄 3~20자" maxlength="20" autocomplete="username" />
        <label>비밀번호</label>
        <input id="authPass" type="password" placeholder="6자 이상" autocomplete="current-password" />
        <div id="authError" class="auth-error hidden"></div>
        <button id="authSubmit" class="primary">로그인</button>
        <p class="auth-toggle">
          <span id="authToggleText">계정이 없나요?</span>
          <a id="authSwitch" href="#">회원가입</a>
        </p>
      </div>
    </div>

    <!-- 홈: 모드 선택 (로그인 후 항상 여기서 시작) -->
    <div id="home" class="setup hidden">
      <div class="setup-card">
        <h1>🎲 AI GM</h1>
        <p class="subtitle">무엇을 하시겠어요?</p>
        <div class="home-choices">
          <button id="homeGameBtn" class="home-card">
            <span class="hc-icon">🎲</span>
            <span class="hc-title">던전 월드</span>
            <span class="hc-desc">AI가 게임 마스터를 맡는 1인용 TRPG. 주사위·HP·아이템을 규칙대로 관리합니다.</span>
          </button>
          <button id="homeChatBtn" class="home-card">
            <span class="hc-icon">💬</span>
            <span class="hc-title">캐릭터 챗</span>
            <span class="hc-desc">세계관과 캐릭터를 직접 만들어 자유롭게 대화. 갤러리에서 남의 세계관도 플레이.</span>
          </button>
        </div>
      </div>
    </div>

    <script src="/common.js"></script>
    <script src="/landing.js"></script>
  </body>
</html>
