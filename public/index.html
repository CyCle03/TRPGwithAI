<!DOCTYPE html>
<!-- lang 속성과 <title> 은 i18n.js 가 현재 언어로 덮어쓴다. -->
<html lang="ko" data-i18n-doctitle="meta.title.landing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI GM · 던전 월드 & 캐릭터 챗</title>
    <link rel="stylesheet" href="/style.css" />
    <!-- 링크를 못 읽는 클라이언트·크롤러는 /favicon.ico 를 그대로 때리므로 둘 다 둔다.
         .ico 는 생성물 — 모양을 바꾸면 favicon.svg 와 함께 고치고
         `node scripts/build-favicon.js` 로 다시 만들 것. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- 배경 영상 · 사용자 바 · 설정/모델 모달은 common.js가 주입한다. -->

    <!-- 로그인 / 회원가입 -->
    <div id="auth" class="setup hidden">
      <div class="setup-card auth-card">
        <h1 data-i18n="auth.title">🎲 AI GM 솔로 던전 월드</h1>
        <p class="subtitle" id="authSubtitle">로그인하고 모험을 시작하세요</p>
        <label data-i18n="auth.id">아이디</label>
        <input id="authUser" type="text" data-i18n-ph="auth.idPlaceholder" placeholder="영문/숫자/밑줄 3~20자" maxlength="20" autocomplete="username" />
        <label data-i18n="auth.pw">비밀번호</label>
        <input id="authPass" type="password" data-i18n-ph="auth.pwPlaceholder" placeholder="6자 이상" autocomplete="current-password" />
        <!-- 가입할 때만 보인다(landing.js 가 토글).
             만 14세 미만은 법정대리인 동의 없이 가입시킬 수 없다(개인정보 보호법 제22조의2). -->
        <div id="authTerms" class="auth-terms hidden">
          <label class="auth-check">
            <input id="authAge" type="checkbox" />
            <span data-i18n-html="auth.consent">만 14세 이상이며,
              <a href="https://elcherlab.com/terms.html" target="_blank" rel="noopener">이용약관</a>과
              <a href="https://elcherlab.com/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에
              동의합니다.</span>
          </label>
        </div>
        <div id="authError" class="auth-error hidden"></div>
        <button id="authSubmit" class="primary">로그인</button>
        <p class="auth-toggle">
          <span id="authToggleText">계정이 없나요?</span>
          <a id="authSwitch" href="#">회원가입</a>
        </p>
        <p class="auth-legal">
          <a href="https://elcherlab.com/terms.html" target="_blank" rel="noopener" data-i18n="auth.terms">이용약관</a>
          · <a href="https://elcherlab.com/privacy.html" target="_blank" rel="noopener" data-i18n="auth.privacy">개인정보처리방침</a>
          · <a href="https://auth.elcherlab.com/account" data-langhref="https://auth.elcherlab.com/account" target="_blank" rel="noopener" data-i18n="auth.myAccount">내 계정</a>
        </p>
      </div>
    </div>

    <!-- 홈: 모드 선택 (로그인 후 항상 여기서 시작) -->
    <div id="home" class="setup hidden">
      <div class="setup-card">
        <h1 data-i18n="home.title">🎲 AI GM</h1>
        <p class="subtitle" data-i18n="home.subtitle">무엇을 하시겠어요?</p>
        <div class="home-choices">
          <button id="homeGameBtn" class="home-card">
            <span class="hc-icon">🎲</span>
            <span class="hc-title" data-i18n="home.game">던전 월드</span>
            <span class="hc-desc" data-i18n="home.gameDesc">AI가 게임 마스터를 맡는 1인용 TRPG. 주사위·HP·아이템을 규칙대로 관리합니다.</span>
          </button>
          <button id="homeChatBtn" class="home-card">
            <span class="hc-icon">💬</span>
            <span class="hc-title" data-i18n="home.chat">캐릭터 챗</span>
            <span class="hc-desc" data-i18n="home.chatDesc">세계관과 캐릭터를 직접 만들어 자유롭게 대화. 갤러리에서 남의 세계관도 플레이.</span>
          </button>
        </div>
      </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/common.js"></script>
    <script src="/landing.js"></script>
  </body>
</html>
