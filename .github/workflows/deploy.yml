name: Deploy to server

# main 브랜치에 push되면 서버의 셀프호스티드 러너가 자동 배포한다.
on:
  push:
    branches: [main]
    # 문서만 고친 푸시로 서비스를 재시작하지 않는다.
    # 재시작하면 진행 중인 게임·챗의 소켓이 끊기는데, .md 는 서빙되지도
    # 런타임에 읽히지도 않아 얻는 게 없다. 게다가 아래 concurrency 가
    # cancel-in-progress 라, 문서 푸시가 돌고 있던 진짜 배포를 취소해 버린다.
    # 코드와 문서를 같이 담은 푸시는 그대로 배포되고, 문서만 담은 푸시는
    # 다음 배포의 git reset --hard origin/main 때 함께 따라온다.
    paths-ignore:
      - '**.md'
  workflow_dispatch: {} # 수동 실행도 허용

# 동시 배포 방지 (이전 실행 취소)
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    # 이 저장소 전용 러너(label: trpg)에서만 실행 — 다른 러너와 격리
    # 공개 저장소 + self-hosted 러너 조합이라, 포크에서 실행되어 남의 코드가
    # 서버에서 돌지 않도록 저장소를 못박는다. (pull_request 트리거도 두지 않는다)
    if: github.repository == 'CyCle03/TRPGwithAI'
    runs-on: [self-hosted, trpg]
    steps:
      # 검사는 러너 작업공간에 따로 받아서 한다. 아래 배포 스텝은 실서버
      # 디렉터리에서 git reset --hard 를 하므로, 거기서 검사하면 이미 나쁜
      # 코드가 배포된 뒤가 된다. 여기서 걸리면 배포 스텝 자체가 돌지 않는다.
      - name: 검사용 코드 가져오기
        uses: actions/checkout@v4

      # 브라우저로 나가는 코드에만 건다. server/ 의 console.log 는 정상적인
      # 서버 로깅이라(journald 로 간다) 대상이 아니다.
      # 구문 오류 하나가 모듈 그래프 전체를 끌어내린다. pet 이 2026-08-13 에 이렇게 죽었다 —
      # i18n 작업이 닫히지 않은 호출을 남겼는데 CI 가 잡지 못했다.
      # 파싱이 멈춘 파일 하나 때문에 첫 화면부터 통째로 비어 버리는데,
      # 테스트는 그 파일을 import 하지 않으면 아무것도 모른 채 통과한다.
      # 그래서 실행이 아니라 '파싱만' 파일별로 확인한다 — DOM 도 서버도 필요 없다.
      # (node --check 는 확장자로 모듈 여부를 보므로 .mjs 로 복사해서 건다.)
      - name: 구문 검사 (브라우저 모듈 전부)
        run: |
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          n=0; fail=0
          while IFS= read -r f; do
            n=$((n + 1))
            cp "$f" "$tmp/m.mjs"
            if ! out=$(node --check "$tmp/m.mjs" 2>&1); then
              echo "구문 오류: $f"
              echo "$out" | sed "s|$tmp/m.mjs|$f|g" | head -5
              fail=1
            fi
          done < <(find public -name '*.js')
          # 경로가 바뀌어 아무것도 안 걸리면 검사가 조용히 사라진다. 그것도 실패로 본다.
          [ "$n" -gt 0 ] || { echo "검사할 파일을 찾지 못했습니다 — find 경로를 확인하세요."; exit 1; }
          [ "$fail" = 0 ] || { echo "구문 검사 실패"; exit 1; }
          echo "구문 검사 통과 — ${n}개 모듈"

      - name: 개발 로그 검사 (브라우저 코드)
        run: |
          if grep -rn 'console\.log\|\bdebugger\b' public/ --include='*.js'; then
            echo "브라우저로 나가는 코드에 console.log 또는 debugger 가 있습니다."
            exit 1
          fi
          echo "개발 로그 없음"

      # 인라인 스크립트가 들어오면 CSP(script-src 'self')에 막혀 조용히 죽는다.
      - name: CSP 회귀 검사 (인라인 핸들러 금지)
        run: |
          if grep -nE ' on[a-z]+=' public/*.html; then
            echo "인라인 이벤트 핸들러가 있습니다. addEventListener 를 쓰세요."
            exit 1
          fi
          if grep -nE '<script[^>]*>[^<[:space:]]' public/*.html; then
            echo "인라인 <script> 블록이 있습니다."
            exit 1
          fi
          echo "인라인 스크립트 없음"

      # **리소스 로드만** 본다. 이 앱에는 AI 키 발급 페이지로 보내는 <a href> 가
      # 여럿 있는데 그건 외부 요청이 아니다 — 문자열만 보면 그것까지 잡힌다.
      - name: 외부 리소스 검사
        run: |
          if grep -rnoE '(src="|@import|url\()https?://' public/ --include='*.js' --include='*.html' --include='*.css'; then
            echo "외부 리소스를 불러옵니다. 자체 호스팅으로 옮기세요."
            exit 1
          fi
          echo "외부 리소스 없음"

      - name: Pull latest & restart service
        run: |
          set -e
          cd ~/trpg-with-ai
          git fetch --all --prune
          git reset --hard origin/main
          npm ci --omit=dev
          sudo systemctl restart trpg-with-ai
          sleep 2
          curl -sf http://localhost:3100/api/health && echo "\n배포 성공"
